    Research:
      - title: Data Structure for Maintaining Kth Maximum / Minimum Element of Polynomial Functions
        date: "2021"
        highlights:
          - Developed algorithms for maintaining order statistics of linear functions using geometric transformations, Modified Quad Tree,
            and Persistent Angular Sorting.
          - Generalized Persistent Angular Sorting to polynomial functions and implemented bucket-based variants.
      - title: Competitive Reinforcement Learning for Graph Coloring Games
        date: "2020"
        highlights:
          - Devised a two-player graph game to identify vertices important to graph connectivity.
          - Applied reinforcement learning with DQN, DDQN, and D3QN, and evaluated strategies on large graphs.
      - title: New Algorithm for Maintaining Lower/Upper Envelope of Similar Convex Figures
        date: "2020"
        highlights:
          - Extended Li Chao trees to maintain envelopes of quadratic functions.
          - Proved applicability to similar convex figures and implemented bucket-based and divide-and-conquer variants.
      - title: New Techniques for Dynamic Programming Optimization using Convex Hull and Segment Tree
        date: "2019"
        highlights:
          - Implemented dynamic convex hulls using splay trees for dynamic programming optimization.
          - Developed Quad Li Chao trees and segment trees containing convex hulls.
    Projects:
      - name: Reinventing the Wheel
        url: https://github.com/arnold518/reinventing-the-wheel
        summary: CircuitSim, a digital logic simulator that builds from gates and arithmetic circuits through memory systems to single-cycle and
          pipelined RV32I processors.
        highlights:
          - Interactive circuit examples and component documentation.
          - Timing models and experiments comparing processor implementations.
      - name: PS Checklist
        url: https://github.com/arnold518/ps-checklist
        summary: A beta application for organizing programming contests, tracking problem progress, and recording practice sessions.
        highlights:
          - ICPC and Olympiad catalogs, with Codeforces and AtCoder contest imports.
          - Shared problem status, dated practice records, and a workflow for curating contest resources.
