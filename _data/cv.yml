    Experience:
      - company: Huawei Technologies Co., Ltd. — Hong Kong Research Center
        position: Research Intern
        start_date: "2025"
        end_date: "2025"
        highlights:
          - Worked on an LLVM-based C++ framework for optimizing large-scale tensor computation graphs.
          - Designed and implemented a new compiler optimization pass, significantly improving its runtime through efficient algorithms and data
            structures; merged into the project's codebase.
          - Developed an efficient DAG analysis tool leveraging flow-based graph algorithms to compute structural metrics and evaluate optimization passes.
      - company: Korean IOI Training Camp
        position: Teaching Assistant
        start_date: "2021"
        end_date: "2024"
        highlights:
          - Assisted in teaching algorithms to more than 50 candidates for the Korean IOI delegation.
    Research:
      - title: Data Structure for Maintaining Kth Maximum / Minimum Element of Polynomial Functions
        date: "2021"
        highlights:
          - Developed algorithms for maintaining order statistics of linear functions using geometric transformations, Modified Quad Tree,
            and Persistent Angular Sorting.
          - Generalized Persistent Angular Sorting to polynomial functions and implemented bucket-based variants.
      - title: Competitive Reinforcement Learning for Graph Coloring Games
        date: "2020"
        highlights:
          - Devised a two-player graph game to identify vertices important to graph connectivity.
          - Applied reinforcement learning with DQN, DDQN, and D3QN, and evaluated strategies on large graphs.
      - title: New Algorithm for Maintaining Lower/Upper Envelope of Similar Convex Figures
        date: "2020"
        highlights:
          - Extended Li Chao trees to maintain envelopes of quadratic functions.
          - Proved applicability to similar convex figures and implemented bucket-based and divide-and-conquer variants.
      - title: New Techniques for Dynamic Programming Optimization Using Convex Hull and Segment Tree
        date: "2019"
        highlights:
          - Implemented dynamic convex hulls using splay trees for dynamic programming optimization.
          - Developed Quad Li Chao trees and segment trees containing convex hulls.
    Projects:
      - name: Reinventing the Wheel
        url: https://github.com/arnold518/reinventing-the-wheel
        summary: Developed a hardware simulation platform that makes the internal behavior of CPUs, memory systems, and I/O devices observable,
          from individual logic gates to complete systems executing programs.
        highlights:
          - Implemented ALUs, memory models spanning flip-flops, SRAM, and DRAM, cache hierarchies, and RV32I/RV32IM processors, integrating memory-mapped
            I/O to run compiled C game workloads. Future directions include AI accelerators and general-purpose GPUs.
          - Designed the platform for computer architecture research, enabling controlled comparisons of processor designs, cache policies, and
            memory technologies under realistic gate and device timing models.
          - Built an event-driven C++20 engine with structural and behavioral models, gate-derived delay tables, and graph-based computation of
            safe clock periods.
      - name: PS Checklist
        url: https://github.com/arnold518/ps-checklist
        summary: A beta application for organizing programming contests, tracking problem progress, and recording practice sessions.
        highlights:
          - ICPC and Olympiad catalogs, with Codeforces and AtCoder contest imports.
          - Shared problem status, dated practice records, and a workflow for curating contest resources.
